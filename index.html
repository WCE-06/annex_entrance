<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>COMPASSION WORLD 別館 入場確認</title>

  <style>
    :root {
      --bg: #f6f0e4;
      --panel: rgba(255, 252, 245, 0.92);
      --text: #5a4633;
      --muted: #8e7862;
      --line: rgba(138, 108, 78, 0.15);
      --accent-deep: #b99369;
      --ok-deep: #6f9360;
      --shadow: 0 20px 40px rgba(122, 94, 64, 0.12);
      --error: #b06652;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, #fff9f0 0%, var(--bg) 55%, #efe6d6 100%);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .wrap {
      width: 100%;
      max-width: 760px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 30px;
      box-shadow: var(--shadow);
      padding: 30px 24px 26px;
      backdrop-filter: blur(12px);
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .title {
      margin: 0;
      font-size: clamp(32px, 6vw, 52px);
      line-height: 1.25;
      letter-spacing: 0.04em;
      color: #6e533c;
      font-weight: 800;
    }

    .sub {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .card {
      background: rgba(255,255,255,0.58);
      border: 1px solid rgba(185, 147, 105, 0.16);
      border-radius: 24px;
      padding: 26px 20px;
    }

    .status {
      min-height: 320px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .icon-area {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }

    .progress-shell {
      width: 100%;
      max-width: 420px;
      margin: 18px auto 0;
    }

    .progress-track {
      width: 100%;
      height: 16px;
      border-radius: 999px;
      background: #eee1cf;
      overflow: hidden;
      box-shadow: inset 0 1px 3px rgba(122, 94, 64, 0.08);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #dbc6aa 0%, #c8a57f 100%);
      transition: width 0.12s linear;
    }

    .progress-num {
      margin-top: 12px;
      text-align: center;
      font-size: 26px;
      font-weight: 800;
      color: #8a6746;
      letter-spacing: 0.04em;
    }

    .spinner {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 5px solid rgba(185, 147, 105, 0.22);
      border-top-color: var(--accent-deep);
      animation: spin 0.85s linear infinite;
      display: none;
    }

    .success-mark {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 35% 30%, #eff9e9, #dceccf);
      box-shadow: inset 0 0 0 1px rgba(111, 147, 96, 0.18);
    }

    .success-mark svg {
      width: 38px;
      height: 38px;
      stroke: var(--ok-deep);
      stroke-width: 3.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .message-main {
      margin: 0;
      text-align: center;
      font-size: clamp(24px, 5vw, 34px);
      line-height: 1.7;
      font-weight: 800;
      color: #6c5037;
    }

    .message-sub {
      margin: 14px 0 0;
      text-align: center;
      font-size: 16px;
      line-height: 1.9;
      color: var(--muted);
      min-height: 1.8em;
    }

    .input-area {
      margin-top: 26px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .code-input {
      flex: 1;
      min-width: 240px;
      height: 58px;
      border-radius: 18px;
      border: 1px solid rgba(185, 147, 105, 0.22);
      background: rgba(255,255,255,0.72);
      color: var(--text);
      font-size: 20px;
      padding: 0 18px;
      outline: none;
    }

    .btn {
      height: 58px;
      border: none;
      border-radius: 18px;
      padding: 0 28px;
      background: linear-gradient(180deg, #e4ceb0 0%, #d5b490 100%);
      color: #65492f;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(185, 147, 105, 0.18);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
    }

    .footer {
      margin-top: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    .error-note { color: var(--error); }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 640px) {
      .wrap {
        padding: 22px 16px 18px;
        border-radius: 24px;
      }

      .message-main {
        font-size: 18px;
        line-height: 1.9;
      }

      .message-sub {
        font-size: 14px;
        line-height: 1.9;
      }

      .input-area {
        flex-direction: column;
      }

      .btn, .code-input {
        width: 100%;
      }

      .code-input {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <header class="header">
      <h1 class="title">COMPASSION WORLD<br>別館</h1>
      <p class="sub">通行許可証・住民登録証をスキャンしてください</p>
    </header>

    <section class="card">
      <div class="status">
        <div class="icon-area">
          <div id="spinner" class="spinner" aria-hidden="true"></div>

          <div id="successMark" class="success-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M5 12.5l4.2 4.2L19 7.5"></path>
            </svg>
          </div>
        </div>

        <p id="messageMain" class="message-main">
          通行許可証・住民登録証を<br>
          スキャンしてください。
        </p>

        <p id="messageSub" class="message-sub"></p>

        <div id="progressShell" class="progress-shell">
          <div class="progress-track">
            <div id="progressFill" class="progress-fill"></div>
          </div>
          <div id="progressNum" class="progress-num">0%</div>
        </div>
      </div>

      <div class="input-area">
        <input
          id="codeInput"
          class="code-input"
          type="text"
          inputmode="text"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
          placeholder="ここにコピーした会員番号をペースト"
        />

        <button id="submitBtn" class="btn" type="button">
          チェックイン
        </button>
      </div>

      <div class="footer">
        別館入口付近で操作してください。
      </div>
    </section>
  </main>

  <script>
    const ANNEX_GAS_URL =
      'https://script.google.com/macros/s/AKfycby2JDQXvVwEpO_F0WPNwlOYKLwSYIhCACsWA_uf6KjACJL1ulS_t5jhumwbyehAeo6MrA/exec';

    const codeInput = document.getElementById('codeInput');
    const submitBtn = document.getElementById('submitBtn');
    const messageMain = document.getElementById('messageMain');
    const messageSub = document.getElementById('messageSub');
    const progressShell = document.getElementById('progressShell');
    const progressFill = document.getElementById('progressFill');
    const progressNum = document.getElementById('progressNum');
    const spinner = document.getElementById('spinner');
    const successMark = document.getElementById('successMark');

    let isSubmitting = false;
    let progressStopper = null;

    function normalizeCustomerCode(value) {
      return String(value || '')
        .trim()
        .replace(/\r/g, '')
        .replace(/\n/g, '')
        .replace(/\s+/g, '')
        .toUpperCase();
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function resetVisualState() {
      if (progressStopper) {
        progressStopper(false);
        progressStopper = null;
      }

      progressShell.style.display = '';
      progressFill.style.width = '0%';
      progressNum.textContent = '0%';

      spinner.style.display = 'none';
      successMark.style.display = 'none';

      messageMain.innerHTML =
        '通行許可証・住民登録証を<br>スキャンしてください。';

      messageSub.textContent = '';
      messageSub.classList.remove('error-note');
    }

    function playTone(freq, duration, gainValue = 0.035) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.value = gainValue;

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();

        setTimeout(() => {
          osc.stop();
          ctx.close();
        }, duration);
      } catch (e) {}
    }

    function playSuccessSound() {
      playTone(784, 120);
      setTimeout(() => playTone(1046, 150), 130);
    }

    function playErrorSound() {
      playTone(280, 170, 0.03);
      setTimeout(() => playTone(230, 190, 0.03), 180);
    }

    function startProgressAnimation() {
      let percent = 0;

      progressShell.style.display = '';
      progressFill.style.width = '0%';
      progressNum.textContent = '0%';

      const timer = setInterval(() => {
        percent = Math.min(percent + 4, 96);
        progressFill.style.width = percent + '%';
        progressNum.textContent = percent + '%';
      }, 80);

      progressStopper = function stopProgress(complete) {
        clearInterval(timer);

        if (complete) {
          progressFill.style.width = '100%';
          progressNum.textContent = '100%';
        } else {
          progressFill.style.width = '0%';
          progressNum.textContent = '0%';
        }
      };

      return progressStopper;
    }

    function getCurrentPositionOnce() {
      return new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(
          pos => resolve({
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            accuracy: pos.coords.accuracy
          }),
          err => reject(err),
          {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
          }
        );
      });
    }

    async function postAnnexEntry(customerCode, location) {
      const res = await fetch(
        ANNEX_GAS_URL,
        {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify({
            action: 'annex_entry',
            customerCode,
            lat: location.lat,
            lng: location.lng,
            accuracy: location.accuracy
          })
        }
      );

      return await res.json();
    }

    function showSuccess() {
      if (progressStopper) {
        progressStopper(true);
      }

      progressShell.style.display = 'none';
      spinner.style.display = 'none';
      successMark.style.display = 'flex';

      messageMain.innerHTML =
        'スマートロックを解錠します。<br>扉を引いてお入りください。';

      messageSub.textContent =
        '入室後は、扉が閉まったことをご確認ください。';

      messageSub.classList.remove('error-note');

      playSuccessSound();

      setTimeout(() => {
        codeInput.value = '';
        resetVisualState();
        isSubmitting = false;
        submitBtn.disabled = false;
      }, 20000);
    }

    function showError(message) {
      if (progressStopper) {
        progressStopper(false);
      }

      spinner.style.display = 'none';
      successMark.style.display = 'none';

      messageMain.innerHTML =
        String(message || '登録情報が確認できませんでした。会員番号が正確に入力できているか、ご確認ください。')
          .replace(/\n/g, '<br>');

      messageSub.innerHTML =
        '登録情報が確認できませんでした。会員番号が正確に入力できているか、ご確認ください。<br><br>' +
        '再試行しても解錠できない場合、<br>' +
        '公式LINEのリッチメニューから、<br>' +
        'ヘルプチャットにてお問い合わせください。';

      messageSub.classList.add('error-note');

      playErrorSound();

      setTimeout(() => {
        codeInput.value = '';
        resetVisualState();
        isSubmitting = false;
        submitBtn.disabled = false;
      }, 10000);
    }

    async function submitCode(rawCode) {
      const customerCode = normalizeCustomerCode(rawCode);

      if (!customerCode) {
        showError('登録情報が確認できませんでした。会員番号が正確に入力できているか、ご確認ください。');
        return;
      }

      if (isSubmitting) return;

      isSubmitting = true;
      submitBtn.disabled = true;

      resetVisualState();

      messageMain.innerHTML =
        '通行許可証・住民登録証を確認しています。<br>現在地を確認しています。';

      messageSub.innerHTML =
        '確認が完了しましたら、<br>入口のスマートロックが解錠されます。';

      const stopProgress = startProgressAnimation();

      let location;

      try {
        location = await getCurrentPositionOnce();
      } catch (err) {
        showError('現在地を確認できませんでした。<br>位置情報の利用を許可してから、もう一度お試しください。');
        return;
      }

      try {
        const result = await postAnnexEntry(customerCode, location);

        if (result && result.ok) {
          stopProgress(true);
          await sleep(250);
          showSuccess();
          return;
        }

        showError(
          result.message ||
          '登録情報が確認できませんでした。会員番号が正確に入力できているか、ご確認ください。'
        );

      } catch (err) {
        showError('通信に失敗しました。<br>少し時間をあけてもう一度お試しください。');
      }
    }

    submitBtn.addEventListener('click', () => {
      submitCode(codeInput.value);
    });

    codeInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        event.preventDefault();
        submitCode(codeInput.value);
      }
    });

    codeInput.addEventListener('input', () => {
      codeInput.value = normalizeCustomerCode(codeInput.value);
    });

    window.addEventListener('load', () => {
      resetVisualState();
      codeInput.focus();
    });
  </script>
</body>
</html>
